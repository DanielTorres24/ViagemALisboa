<style>
  :root{
    --bg:#f1f4f7; --card:#ffffff; --text:#101c27; --muted:#4a5b6b; --line:#d5dde5; --soft:#f4f6f9;
    --navy:#0b2a3f; --tile:#16466f;
    --c-start:#44546a; --c-charge:#0f8a4a; --c-stop:#c2185b; --c-food:#d35f00;
    --c-hotel:#6a3fb5; --c-sight:#007c89; --c-park:#1565c0;
    --w-low-bg:#e3f5ea; --w-low:#0b6b38; --w-mid-bg:#fff1d6; --w-mid:#8a5300; --w-high-bg:#fde4e4; --w-high:#a61b1b;
    --waze:#33ccff; --waze-text:#04222f;
    --warn-bg:#fff1d6; --warn-text:#7a4a00; --warn-line:#f0b44c;
    --now:#ffd400; --now-text:#2b2200; --nextc:#9fd3ff;
    --star:#b26a00;
    --radius:16px; --hdr:130px;

  @media (prefers-color-scheme: dark){

      --c-start:#5d6f86; --c-charge:#16a35a; --c-stop:#d63a78; --c-food:#e0721a; --c-hotel:#8059cf; --c-sight:#0f97a5; --c-park:#2a7ad6;
      --w-low-bg:#123825; --w-low:#7fe0a8; --w-mid-bg:#3a2d10; --w-mid:#ffd27a; --w-high-bg:#401818; --w-high:#ff9b9b;
      --warn-bg:#3a2d10; --warn-text:#ffd88a; --warn-line:#9a6b12; --star:#ffc35a;

  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  :root{padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:18px;line-height:1.45;color:var(--text);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}

  .hero{background:var(--navy);color:#fff;padding:18px 18px 6px}
  .hero h1{margin:0;font-size:1.45rem;line-height:1.2}
  .hero p{margin:4px 0 0;color:#c5d6e4;font-size:.98rem}
  .hero{display:flow-root}
  .summary-link{float:right;margin:0 0 6px 10px;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;
    background:#fff;color:var(--navy);font-weight:800;font-size:.95rem;text-decoration:none}
  .summary-link:focus-visible{outline:3px solid var(--now);outline-offset:2px}

  /* Barra fixa: dias + agora/a seguir */
  .topbar{position:sticky;top:0;z-index:20;background:var(--navy);padding:8px 10px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));box-shadow:0 2px 0 rgba(0,0,0,.25)}
  nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;border-radius:12px;
    background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-weight:700;font-size:.86rem;line-height:1.15;text-align:center;padding:4px 2px;-webkit-tap-highlight-color:transparent}
  nav a small{font-weight:500;font-size:.78rem;color:#c5d6e4}
  nav a.on{background:#fff;color:var(--navy)}
  nav a.on small{color:#35566e}
  nav a.tesla-link{background:var(--c-charge);color:#fff}
  nav a.tesla-link small{color:#d9f5e5}
  nav a.park-link{background:var(--c-park);color:#fff}
  nav a.park-link small{color:#dbe9ff}

  .topbar.compact nav a{min-height:36px;font-size:.82rem}
  .topbar.compact nav a small{display:none}
  .topbar.compact .status{gap:4px;margin-top:6px}
  .topbar.compact .st{min-height:34px;padding:4px 10px}
  .topbar.compact .st span{font-size:.9rem}

  .pk{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border-radius:12px;padding:10px 12px;margin:0 0 12px}
  .pk b{grid-row:1 / span 2;font-size:.9rem;font-weight:900;border-radius:8px;padding:6px 8px;white-space:nowrap}
  .pk span{font-size:.98rem}
  .pk a{font-size:.92rem;font-weight:800;color:inherit}
  .pk.free{background:#e3f5ea;color:#0b4f2b} .pk.free b{background:#0f8a4a;color:#fff}
  .pk.paid{background:#fff1d6;color:#5c3900} .pk.paid b{background:#c77700;color:#fff}
  .pk.host{background:#e8eef7;color:#1d3350} .pk.host b{background:#44546a;color:#fff}

    .pk.free{background:#123825;color:#c9f2da} .pk.paid{background:#3a2d10;color:#ffe2a6} .pk.host{background:#1a2a3c;color:#d5e1ef}

  .guide ol,.guide ul{margin:0;padding-left:22px}
  .guide li{margin:0 0 8px}
  .guide p{margin:0 0 10px}
  .guide.key{border:3px solid var(--c-charge)}
  .guide.warnb{background:var(--warn-bg);color:var(--warn-text);border:0;border-left:6px solid var(--warn-line)}
  .zones{display:grid;gap:6px;margin:0 0 10px}
  .zone{display:flex;align-items:center;gap:10px;font-size:1rem}
  .zone i{width:26px;height:26px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(0,0,0,.2)}
  .linkbtns{display:grid;gap:8px;margin-top:6px}
  .linkbtns a{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;text-decoration:none;font-weight:800;text-align:center;padding:6px 10px;background:var(--card);color:var(--text);border:2px solid var(--c-park)}

  .status{display:grid;gap:6px;margin-top:8px}
  .st{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;min-height:44px}
  .st b{flex:0 0 auto;font-size:.78rem;font-weight:800;border-radius:999px;padding:3px 9px}
  .st.now b{background:var(--now);color:var(--now-text)}
  .st.next b{background:var(--nextc);color:#06223a}
  .st span{flex:1 1 auto;min-width:0;font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st.info span{white-space:normal;font-weight:600}

  main{padding:4px 12px 40px;max-width:640px;margin:0 auto}

  .day-head{border-radius:var(--radius);color:#fff;padding:16px;margin:20px 0 14px;background-color:var(--tile);

    background-size:28px 28px;background-position:0 0,14px 14px;scroll-margin-top:var(--hdr)}
  .day-head h2{margin:0;font-size:1.4rem;line-height:1.2}
  .day-head p{margin:6px 0 0;font-size:.98rem;color:#e3eefa}
  .tesla-head{background-color:var(--c-charge)}

  .k-start{--k:var(--c-start)} .k-end{--k:var(--c-start)} .k-charge{--k:var(--c-charge)} .k-stop{--k:var(--c-stop)}
  .k-food{--k:var(--c-food)} .k-hotel{--k:var(--c-hotel)} .k-sight{--k:var(--c-sight)} .k-park{--k:var(--c-park)}

  .stop{background:var(--card);border:2px solid var(--k);border-radius:var(--radius);margin:0 0 16px;overflow:hidden;scroll-margin-top:var(--hdr)}

  .stop-head{display:flex;align-items:center;gap:12px;background:var(--k);color:#fff;padding:10px 14px}

  .head-txt{flex:1 1 auto;min-width:0}
  .stop-head .time{font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .stop-head .klabel{font-size:.9rem;font-weight:600;opacity:.95}
  .flag{display:none;flex:0 0 auto;font-weight:800;font-size:.85rem;padding:6px 10px;border-radius:999px}
  .stop.now{box-shadow:0 0 0 5px var(--now)}
  .stop.now .flag.f-now{display:block;background:var(--now);color:var(--now-text)}
  .stop.next .flag.f-next{display:block;background:var(--nextc);color:#06223a}

  .stop-body{padding:12px 14px 16px}
  .stop h3{margin:0 0 4px;font-size:1.22rem;line-height:1.25}
  .addr{margin:0 0 10px;color:var(--muted);font-size:.98rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;border-radius:999px;padding:4px 11px;background:var(--soft);color:var(--text)}
  .w-low{background:var(--w-low-bg);color:var(--w-low)} .w-mid{background:var(--w-mid-bg);color:var(--w-mid)} .w-high{background:var(--w-high-bg);color:var(--w-high)}
  .chip.opt{color:var(--muted);border:1px dashed var(--muted)}
  .desc{margin:0 0 12px}
  .warn{background:var(--warn-bg);color:var(--warn-text);border-left:5px solid var(--warn-line);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-weight:600;font-size:.98rem}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;text-decoration:none;font-weight:800;font-size:.95rem;-webkit-tap-highlight-color:transparent;text-align:center;padding:6px 8px}

  .btn.waze{background:var(--waze);color:var(--waze-text)}
  .btn.gmaps{background:var(--card);color:var(--text);border:2px solid var(--line)}

  details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
  details.more summary{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 0;min-height:40px;list-style-position:inside}
  dl.info{margin:6px 0 0;display:grid;gap:8px}
  dl.info div{display:grid;grid-template-columns:28px 1fr;column-gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px}
  dl.info dt{grid-column:2;font-size:.82rem;font-weight:700;color:var(--muted)}
  dl.info dd{grid-column:2;margin:0;font-size:1rem}
  dl.info .ic{grid-row:1 / span 2;grid-column:1;font-size:1.15rem;line-height:1.4}

  .eats{display:grid;gap:10px;margin:0 0 4px}
  .eats-title{margin:0 0 8px;font-weight:800;font-size:1rem}
  .eat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
  .eat-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .eat-top strong{font-size:1.08rem}
  .star{flex:0 0 auto;font-weight:800;color:var(--star)}
  .eat-meta{margin:2px 0 4px;color:var(--muted);font-size:.88rem}
  .eat p.note{margin:0 0 8px;font-size:.98rem}
  .eat-btns{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
  .eat-btns a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;text-decoration:none;font-weight:800;font-size:.92rem;text-align:center;padding:4px}
  .eat-btns .w{background:var(--waze);color:var(--waze-text)}
  .eat-btns .g{background:var(--card);color:var(--text);border:2px solid var(--line)}
  .eat-btns .t{background:var(--card);color:var(--text);border:2px solid var(--c-food)}
  .eat-btns a.off{visibility:hidden}

  .note-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px}
  .note-box h3{margin:0 0 8px;font-size:1.15rem}
  .note-box ul{margin:0;padding-left:20px} .note-box li{margin:0 0 6px}
  .note-box.alert{background:var(--warn-bg);color:var(--warn-text);border:0;border-left:6px solid var(--warn-line)}
  table{width:100%;border-collapse:collapse;font-size:.96rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.84rem;color:var(--muted)}
  .scroll-x{overflow-x:auto}
  footer{max-width:640px;margin:0 auto;padding:6px 16px 30px;color:var(--muted);font-size:.9rem}
  noscript{display:block;padding:16px;background:var(--warn-bg);color:var(--warn-text);font-weight:700}

  @media (min-width:560px){ dl.info{grid-template-columns:1fr 1fr} }
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .btn:active{transform:none} }
</style>
</head>

const KIND = { start:["🏁","Partida"], charge:["⚡","Carregar"], stop:["📍","Paragem"], food:["🍽️","Refeição"],
  hotel:["🛏️","Alojamento"], sight:["🏛️","Visita"], park:["🅿️","Estacionar"], end:["🏠","Chegada"] };
const WALK = { low:["w-low","Pouca caminhada"], mid:["w-mid","Caminhada moderada"], high:["w-high","Mais caminhada"] };
const ICON = { "Troço até aqui":"🚗", "Chegada estimada":"🕒", "Estacionamento":"🅿️", "Acessibilidade e caminhada":"🚶", "Capacidade":"⚡", "Duração":"⏱️" };

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rowsHTML = rows => `<dl class="info">${rows.map(r => `<div><span class="ic" aria-hidden="true">${ICON[r[0]]||"•"}</span><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>`;
const navBtns = p => `<div class="btns"><a class="btn waze" href="${waze(p)}" target="_blank" rel="noopener">ABRIR NO WAZE</a><a class="btn gmaps" href="${gmaps(p)}" target="_blank" rel="noopener">GOOGLE MAPS</a></div>`;

function eatHTML(list){
  return `<p class="eats-title">Sugestões (comida portuguesa, preço moderado)</p><div class="eats">${list.map(e => `
    <div class="eat">
      <div class="eat-top"><strong>${esc(e.n)}</strong><span class="star">★ ${esc(e.r)}</span></div>
      <p class="eat-meta">${esc(e.c)} avaliações no Google Maps. ${esc(e.h)}</p>
      <p class="note">${esc(e.note)}</p>
      <div class="eat-btns">
        <a class="w" href="${waze(e)}" target="_blank" rel="noopener">WAZE</a>
        <a class="g" href="${gmaps(e)}" target="_blank" rel="noopener">MAPS</a>
        <a class="t${e.tel?"":" off"}" href="${e.tel?"tel:"+e.tel:"#"}">LIGAR</a>
      </div>
    </div>`).join("")}</div>`;
}

const PKL = { free:"🅿️ GRÁTIS", paid:"🅿️ PAGO", host:"🅿️ ALOJAMENTO" };
function pkHTML(p){
  if(!p) return "";
  return `<div class="pk ${p.t}"><b>${PKL[p.t]}</b><span>${esc(p.x)}</span>${p.t==="paid" ? `<a href="#pagar">Como pagar</a>` : ""}</div>`;
}

function stopHTML(day, s, i){
  const k = KIND[s.kind];
  const chips = [];
  if(s.walk) chips.push(`<span class="chip ${WALK[s.walk][0]}">🚶 ${WALK[s.walk][1]}</span>`);
  chips.push(`<span class="chip">⏱️ ${esc(s.stay)}</span>`);
  if(s.opt) chips.push(`<span class="chip opt">Opcional</span>`);
  const more = [];
  if(s.leg) more.push(["Troço até aqui", s.leg]);
  if(s.eta) more.push(["Chegada estimada", s.eta]);
  if(s.access) more.push(["Acessibilidade e caminhada", s.access]);
  return `
  <article class="stop k-${s.kind}${s.opt?" optional":""}" id="${day.id}-${i}">
    <div class="stop-head">
      <span class="kicon" aria-hidden="true">${k[0]}</span>
      <div class="head-txt"><div class="time">${esc(s.time)}</div><div class="klabel">${k[1]}, ${day.dateLabel}</div></div>
      <span class="flag f-now">AGORA</span><span class="flag f-next">A SEGUIR</span>
    </div>
    <div class="stop-body">
      <h3>${esc(s.title)}</h3>
      <p class="addr">${esc(s.addr)}</p>
      <div class="chips">${chips.join("")}</div>
      ${pkHTML(s.pk)}
      ${s.needsAddr ? `<p class="warn">Falta a morada da loja de pedras.</p>` : ""}
      <p class="desc">${esc(s.desc)}</p>
      ${s.eat ? eatHTML(s.eat) : navBtns(s)}
      ${more.length ? `<details class="more"><summary>Mais informação</summary>${rowsHTML(more)}</details>` : ""}
    </div>
  </article>`;
}

const dayHTML = d => `<section id="${d.id}"><div class="day-head"><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p></div>${d.stops.map((s,i)=>stopHTML(d,s,i)).join("")}</section>`;

document.getElementById("app").innerHTML = TRIP.map(dayHTML).join("") + teslaHTML() + pagarHTML();

/* ---------- Hora atual: onde estamos agora e o que vem a seguir ---------- */
const ALL = [];
TRIP.forEach(d => d.stops.forEach((s,i) => {
  const m = s.time.match(/\d{2}:\d{2}/);
  ALL.push({ id:`${d.id}-${i}`, day:d, s, t:new Date(`${d.date}T${m[0]}:00`) });
}));

function setHeaderOffset(){
  const h = document.getElementById("topbar").offsetHeight;
  document.documentElement.style.setProperty("--hdr", (h + 12) + "px");
}

function update(scroll){
  const now = new Date();
  let cur = null, next = null;
  for(const x of ALL){ if(x.t <= now) cur = x; else { next = x; break; } }
  if(cur && now - cur.t > 3*3600*1000) cur = null;

  document.querySelectorAll(".stop.now,.stop.next").forEach(e => e.classList.remove("now","next"));
  if(cur)  document.getElementById(cur.id).classList.add("now");
  if(next) document.getElementById(next.id).classList.add("next");

  const todayISO = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const label = x => (x.day.date !== todayISO ? x.day.dateLabel + " " : "") + x.s.time.match(/\d{2}:\d{2}/)[0] + " " + x.s.title;
  const st = [];
  if(cur)  st.push(`<a class="st now" href="#${cur.id}"><b>AGORA</b><span>${esc(label(cur))}</span></a>`);
  if(next) st.push(`<a class="st next" href="#${next.id}"><b>A SEGUIR</b><span>${esc(label(next))}</span></a>`);
  if(!cur && !next) st.push(`<div class="st info"><span>Viagem concluída. Bem-vindos a casa!</span></div>`);
  document.getElementById("status").innerHTML = st.join("");
  setHeaderOffset();

  document.querySelectorAll("nav a[data-day]").forEach(a => a.classList.remove("on"));
  const focus = cur || next;
  if(focus){
    const a = document.querySelector(`nav a[data-day="${focus.day.date}"]`);
    if(a) a.classList.add("on");
    if(scroll && now >= new Date("2026-10-03T00:00:00")) setTimeout(() => document.getElementById(focus.id).scrollIntoView({behavior:"smooth", block:"start"}), 300);
  }
}
update(!location.hash);
if(location.hash){ const t = document.getElementById(location.hash.slice(1)); if(t) setTimeout(() => t.scrollIntoView({block:"start"}), 50); }
setInterval(() => update(false), 60*1000);
window.addEventListener("resize", setHeaderOffset);

/* Barra compacta depois de passar o cabeçalho (com margem para não oscilar) */
const topbar = document.getElementById("topbar");
function onScroll(){
  const y = window.scrollY, c = topbar.classList.contains("compact");
  if(!c && y > 140){ topbar.classList.add("compact"); setHeaderOffset(); }
  else if(c && y < 40){ topbar.classList.remove("compact"); setHeaderOffset(); }
}
window.addEventListener("scroll", onScroll, {passive:true});
onScroll();
</script>
